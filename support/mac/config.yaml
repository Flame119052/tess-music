# Tess Support on a person's Mac. They open the chat in the app. There is no messaging platform here.
# The model is reached only through the support gate. Hermes reads providers.<name>.base_url,
# key_env and api_mode (hermes_cli/runtime_provider_custom.py). The bearer is the support token,
# never an OpenCode key (D-104).

model:
  provider: tess-gate
  default: deepseek-v4.1-flash
  # The base of the gate. Hermes's own client appends /chat/completions (agent/agent_runtime_helpers.py),
  # which is the gate's route, POST /v1/support/chat/completions (D-103). The dry-run builds the same URL.
  base_url: ${TESS_INBOX}/v1/support

providers:
  tess-gate:
    name: tess-gate
    base_url: ${TESS_INBOX}/v1/support
    key_env: TESS_SUPPORT_TOKEN
    api_mode: chat_completions
    default_model: deepseek-v4.1-flash

agent:
  # A picture of Spotify is evidence, so an attached image stays an image.
  image_input_mode: auto
  # The visit needs a terminal, the skills, and a look at the picture or the short recording.
  # code_execution is off because a script can start a process without hitting the shell deny list.
  disabled_toolsets:
    - computer_use
    - desktop_ui
    - browser
    - file
    - web
    - cronjob
    - delegation
    - code_execution
    - image_gen
    - video_gen
    - x_search
    - tts
    - memory
    - session_search
    - connections
    - discord
    - discord_admin
    - yuanbao
    - kanban
    - todo

# Exact calls that may run without a question. Hermes compares the whole line,
# case-sensitive (tools/approval_floors.py): no *, ? or [ means that text only,
# and a glob has to match the entire line. &&, ;, |, a backtick and $( never
# match here, even inside a glob. $HERMES_HOME and $HOME stay unquoted in the
# skills: a quoted $ is a second command, so it would ask on every visit.
# node -e, --eval and -p are denied below, so a glob cannot pre-approve them.
command_allowlist:
  - 'tess doctor'
  - 'zsh $HOME/Library/Application\ Support/Tess/doctor.sh'
  - 'tail -40 $HOME/Library/Application\ Support/Tess/guard.log'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-evidence/scripts/spotify-window.mjs'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-evidence/scripts/spotify-window.mjs still */spotify.png'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-evidence/scripts/spotify-window.mjs video */spotify.mov'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-support/scripts/session.mjs new'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-support/scripts/session.mjs sweep'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-support/scripts/session.mjs add */spotify.mov --record'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-support/scripts/session.mjs handoff *'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-support/scripts/inbox.mjs issues'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-support/scripts/inbox.mjs report *'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-support/scripts/inbox.mjs recording *'
  - 'node $HERMES_HOME/profiles/tess-support/skills/tess-handoff/scripts/triage-inbox.mjs --report * --words * --title-file * --summary-file * --mode inbox'

approvals:
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  timeout: 300
  deny:
    - 'sudo *'
    - 'rm -rf *'
    - 'rm -fr *'
    - 'chmod -R *'
    - 'dd *'
    - 'mkfs*'
    - 'launchctl bootstrap*'
    - 'launchctl submit*'
    - '*curl*|*sh*'
    - '*curl*|*bash*'
    - '*/Applications/Spotify.app*'
    - '*screencapture*-G*'
    - '*screencapture*-D*'
    - 'node -e*'
    - 'node --eval*'
    - 'node -p*'
    - '*&&*'
    - '*;*'
    - '*|*'
    - '*`*'
    - '*$(*'
