# Tess inbox (Cloudflare Worker). Deploy: npx wrangler@4 deploy   (from this folder, with the owner's Cloudflare login)
#
# Required secret, without which /v1/report answers 503 and stores nothing (the stored per-IP keys would otherwise be a
# plain hash of an IP address):  npx wrangler@4 secret put SALT
# Support chat secret, sent only upstream. Never put the value in this file:  npx wrangler@4 secret put OPENCODE_GO_API_KEY
name = "tess-inbox"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "tess-music-player.janus.ing", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "tess-inbox"
database_id = "83718330-853d-44a2-9b4b-9edf1b4ecc00"

# Recordings and stills of a person's Spotify window. Never served back; the scheduled job deletes each one when its report is
# filed or at 14 days, and set a lifecycle rule on this bucket too (delete after 14 days) so an unapplied deploy can't
# leave one lying there. Object lifecycle is configured on the bucket, not here.
[[r2_buckets]]
binding = "SUPPORT"
bucket_name = "tess-support"

[[kv_namespaces]]
binding = "RESCUE"
id = "26cadf05786a439b89302a0641180c39"

[triggers]
crons = ["17 4 * * *"]

[observability]
enabled = false

# Support chat. OPENCODE_GO_API_KEY is a Worker secret (`wrangler secret put`), never a var and never in this file.
# SUPPORT_UPSTREAM picks between two allowlisted OpenCode URLs: "go" is the paid Go plan
# (https://opencode.ai/zen/go/v1/chat/completions) and "zen" is the free Zen tier
# (https://opencode.ai/zen/v1/chat/completions). Any other value makes chat answer 503. "go" stays the committed
# default until Zen with this key and model is proven live. SUPPORT_MODEL names the model sent upstream; a Mac may
# still ask for the model its install shipped with.
# Caps are UTC-day counters in D1. Token caps of 0 turn that budget off. Request caps apply before the upstream call.
[vars]
SUPPORT_UPSTREAM = "go"
SUPPORT_MODEL = "deepseek-v4.1-flash"
SUPPORT_CHAT_PERSON_REQUESTS = "200"
SUPPORT_CHAT_SHARED_REQUESTS = "400"
SUPPORT_CHAT_PERSON_TOKENS = "300000"
SUPPORT_CHAT_SHARED_TOKENS = "2000000"

# Cloudflare's own per-IP limiter (no database work): 6 reports a minute per IP. Health reports and support
# posts use this binding. Support chat does not.
[[ratelimits]]
name = "LIMIT"
namespace_id = "7301"
simple = { limit = 6, period = 60 }

# Support chat. A conversation makes several model calls in a row, and it must not spend the reports' 6 a minute.
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "7302"
simple = { limit = 30, period = 60 }
