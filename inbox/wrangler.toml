# Tess inbox (Cloudflare Worker). Deploy: npx wrangler@4 deploy   (from this folder, with the owner's Cloudflare login)
name = "tess-inbox"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "tess-music-player.janus.ing", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "tess-inbox"
database_id = "83718330-853d-44a2-9b4b-9edf1b4ecc00"

# Recordings of a person's Spotify window. Never served back; the scheduled job deletes each one when its report is
# filed or at 14 days, and set a lifecycle rule on this bucket too (delete after 14 days) so an unapplied deploy can't
# leave one lying there. Object lifecycle is configured on the bucket, not here.
[[r2_buckets]]
binding = "SUPPORT"
bucket_name = "tess-support"

[[kv_namespaces]]
binding = "RESCUE"
id = "26cadf05786a439b89302a0641180c39"

[triggers]
crons = ["17 4 * * *"]

[observability]
enabled = false

# Cloudflare's own per-IP limiter (no database work): 6 reports a minute per IP
[[ratelimits]]
name = "LIMIT"
namespace_id = "7301"
simple = { limit = 6, period = 60 }
