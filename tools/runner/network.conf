# Tess reviewer runners: a review may reach its provider's API and nothing on this machine.
#
# Install it into the systemd unit GitHub's runner setup made (`actions.runner.*`), so it covers every provider at
# once, Claude included. tools/runner-setup.md, "Network: the provider's API and nothing else", has the exact commands,
# the way to tell what is really in force, and how to handle DNS on Ubuntu and on Arch.
#
# Why the runner and not each CLI: a review reads an untrusted diff, and a diff can talk a model into running a shell
# command. bubblewrap keeps the host network namespace on purpose, because the API call needs it. On paperclip-vps the
# rest of that namespace is Paperclip's PostgreSQL, its services and the Tincan relay; on omarchy it is the LAN. So the
# limit is applied to the service the whole job runs under, and inherits into every sandbox it starts.

[Service]

# The machine itself: loopback, IPv4 link-local and IPv6 link-local.
IPAddressDeny=127.0.0.0/8
IPAddressDeny=::1
IPAddressDeny=169.254.0.0/16
IPAddressDeny=fe80::/10

# Local discovery, which no review needs.
IPAddressDeny=224.0.0.0/4
IPAddressDeny=ff00::/8

# Every private network: the LAN, the office, a home router.
IPAddressDeny=10.0.0.0/8
IPAddressDeny=172.16.0.0/12
IPAddressDeny=192.168.0.0/16

# Tailscale's own range, and IPv6 unique-local (which Tailscale and most VPNs also use).
IPAddressDeny=100.64.0.0/10
IPAddressDeny=fc00::/7

# The only local address a review needs: the DNS stub systemd-resolved listens on. Allowing an address rather than a
# port is what systemd offers, so it is kept to a single loopback address, and it is the resolver's, not a service's.
# Without a name server entry here nothing resolves and no provider can be reached at all.
IPAddressAllow=127.0.0.53

# A machine that does not run systemd-resolved (a plain NetworkManager Arch box has the router's address in
# /etc/resolv.conf, which the range above refuses) has two ways out, in tools/runner-setup.md: turn on systemd-resolved,
# which is one command and keeps this file as it is, or add that one resolver address below. The second opens that
# address on every port, so prefer the first.
#IPAddressAllow=192.0.2.1
