name: agent dispatch
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      is_pr: ${{ steps.gate.outputs.is_pr }}
      pr_head_ref: ${{ steps.gate.outputs.pr_head_ref }}
      pr_head_sha: ${{ steps.gate.outputs.pr_head_sha }}
      subject_url: ${{ steps.gate.outputs.subject_url }}
      refusal: ${{ steps.gate.outputs.refusal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check caller, request, and CI
        id: gate
        env:
          AGENT_ALLOWLIST: ${{ vars.AGENT_ALLOWLIST }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "allowed=false"
            echo "is_pr=false"
            echo "pr_head_ref="
            echo "pr_head_sha="
            echo "subject_url="
            echo "refusal="
          } >> "$GITHUB_OUTPUT"

          # Marked bot comments never dispatch, so this lane cannot call itself.
          if [[ "$COMMENT_BODY" == *"<!-- tess-review-bot -->"* ]]; then
            exit 0
          fi

          # Anyone may open an issue or a PR. Only an allowlisted account starts work, and a refusal for an
          # account that is not allowed is deliberately silent.
          caller_allowed=false
          IFS=',' read -ra accounts <<< "$AGENT_ALLOWLIST"
          for account in "${accounts[@]}"; do
            account="${account#"${account%%[![:space:]]*}"}"
            account="${account%"${account##*[![:space:]]}"}"
            if [[ "$account" == "$COMMENTER" ]]; then
              caller_allowed=true
              break
            fi
          done
          if [[ "$caller_allowed" != true ]]; then
            exit 0
          fi

          task="$(printf '%s\n' "$COMMENT_BODY" | awk '/^@tess-agent (review|fix|approach)([[:space:]]|$)/ { print $2; exit }')"
          if [[ "$task" != "review" && "$task" != "fix" && "$task" != "approach" ]]; then
            exit 0
          fi

          issue="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER")"
          subject_url="$(jq -r '.html_url' <<< "$issue")"
          is_pr=false
          pr_head_ref=
          pr_head_sha=
          pr_url="$(jq -r '.pull_request.url // empty' <<< "$issue")"
          if [[ -n "$pr_url" ]]; then
            is_pr=true
            pr="$(gh api "repos/$REPOSITORY/pulls/$ISSUE_NUMBER")"
            pr_head_ref="$(jq -r '.head.ref' <<< "$pr")"
            pr_head_repo="$(jq -r '.head.repo.full_name' <<< "$pr")"
            # Text nobody here wrote must never reach a machine that holds keys or runs Paperclip. A fork PR is
            # refused for every task, review included: plan mode is not a filesystem sandbox.
            if [[ "$pr_head_repo" != "$REPOSITORY" ]]; then
              echo "refusal=fork-pr"
              exit 0
            fi
            pr_head_sha="$(jq -r '.head.sha' <<< "$pr")"
            conclusion="$(gh api "repos/$REPOSITORY/actions/workflows/check.yml/runs?head_sha=$pr_head_sha&event=pull_request&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].conclusion // ""')"
            if [[ "$conclusion" != "success" ]]; then
              echo "refusal=ci-not-passed"
              exit 0
            fi
          fi

          {
            echo "allowed=true"
            echo "is_pr=$is_pr"
            echo "pr_head_ref=$pr_head_ref"
            echo "pr_head_sha=$pr_head_sha"
            echo "subject_url=$subject_url"
          } >> "$GITHUB_OUTPUT"

  dispatch:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: [self-hosted, tess-dispatch]
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      refusal: ${{ steps.run.outputs.refusal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Start and follow the T3 thread
        id: run
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ needs.gate.outputs.is_pr }}
          PR_HEAD_REF: ${{ needs.gate.outputs.pr_head_ref }}
          PR_HEAD_SHA: ${{ needs.gate.outputs.pr_head_sha }}
          REPOSITORY: ${{ github.repository }}
          SUBJECT_URL: ${{ needs.gate.outputs.subject_url }}
          REFUSAL_FILE: ${{ runner.temp }}/tess-agent-refusal.json
        run: |
          set +e
          node tools/agent-dispatch.mjs
          status=$?
          if [[ $status -ne 0 ]]; then
            # Only the fixed code leaves this runner. The reason and the run link are posted by a GitHub-hosted job,
            # which holds no dispatcher credential.
            echo "refusal=$(node tools/agent-dispatch.mjs reason)" >> "$GITHUB_OUTPUT"
          fi
          exit $status

  notice:
    needs: [gate, dispatch]
    if: always() && (needs.gate.outputs.refusal != '' || needs.dispatch.outputs.refusal != '')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Post the refusal
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          REFUSAL_REASON: ${{ needs.gate.outputs.refusal || needs.dispatch.outputs.refusal }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/agent-dispatch.mjs refuse
