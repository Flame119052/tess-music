# Runs on every push and pull request: the same safety gate the release uses, plus builds and tests.
# A red check here means something is broken even if nothing was released.
name: check
on:
  push:
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: patcher/go.mod, cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch the stable channel (the safety gate checks what users get)
        run: git fetch --depth=1 origin stable:refs/remotes/origin/stable || true
      - name: Safety checks (installer, updater, doctor, rescue, patcher swap)
        run: tools/check-safety.sh
      - name: Theme builds and parses
        run: node tools/build.mjs && node --check theme/Tess/theme.js && node --check theme/loader/loader.js
      - name: Patcher builds
        run: cd patcher && go build ./... && go vet ./src/cmd/
      - name: Installer, updater, wake and rescue tests (sandbox, fake launchctl/pmset/curl)
        run: |
          node tools/test-updater.mjs
          node tools/test-wake.mjs
          node tools/test-rescue-control.mjs
          node tools/test-swap-recovery.mjs
          node tools/test-rescue.mjs
      - name: Dial picking tests
        run: node tools/test-dial-pick.mjs
      - name: Reviewer agent tests
        run: node tools/test-agent-review.mjs
      - name: Tools parse
        run: for f in tools/*.mjs; do node --check "$f"; done
