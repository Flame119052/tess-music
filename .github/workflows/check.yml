# Runs on every push and pull request: the same safety gate the release uses, plus builds and tests.
# A red check here means something is broken even if nothing was released.
name: check
on:
  push:
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: patcher/go.mod, cache: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch the stable channel (a notice if it has no installer yet, not a failure)
        run: git fetch --depth=1 origin stable:refs/remotes/origin/stable || true
      - name: Safety checks (installer, updater, doctor, rescue, patcher swap)
        run: tools/check-safety.sh
      - name: Committed verifier matches patcher/tessverify
        working-directory: patcher
        run: |
          pin=$(sed -n "s/^VERIFY_SHA='\([0-9a-f]\{64\}\)'$/\1/p" ../installer/install.sh)
          for a in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$a go build -trimpath -buildvcs=false -ldflags '-s -w' -o "$RUNNER_TEMP/tv-$a" ./tessverify
          done
          lipo -create "$RUNNER_TEMP/tv-arm64" "$RUNNER_TEMP/tv-amd64" -output "$RUNNER_TEMP/tess-verify"
          [ "$(shasum -a 256 "$RUNNER_TEMP/tess-verify" | cut -d' ' -f1)" = "$pin" ] || { echo "installer/verify/<sha> is stale; rebuild it, commit it under its hash, and update VERIFY_SHA"; exit 1; }
      - name: Theme builds and parses
        run: node tools/build.mjs && node --check theme/Tess/theme.js && node --check theme/loader/loader.js
      - name: Patcher builds
        run: cd patcher && go build ./... && go vet ./src/cmd/
      - name: Installer, updater, wake and rescue tests (sandbox, fake launchctl/pmset/curl)
        run: |
          node tools/test-script-guards.mjs
          node tools/test-installer-legacy.mjs
          node tools/test-installer-legacy.mjs --command
          node tools/test-updater.mjs
          node tools/test-upgrade.mjs
          node tools/test-wake.mjs
          node tools/test-rescue-control.mjs
          node tools/test-swap-recovery.mjs
          node tools/test-rescue.mjs
      - name: Inbox and privacy filter tests (Worker driven directly; one filter in every report path)
        run: |
          node tools/test-inbox.mjs
          node tools/test-redact.mjs
      - name: Dial picking tests
        run: node tools/test-dial-pick.mjs
      - name: Support bot triage and setup tests
        run: node tools/test-support.mjs
      - name: Inbox support endpoint tests
        run: |
          node tools/test-inbox-support.mjs
          node tools/test-support-chat.mjs
      - name: Support session folder tests
        run: node tools/test-session.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Hermes packages for the Mac profile check
        run: |
          py=$(bash tools/hermes-test-env.sh)
          echo "TESS_HERMES_PYTHON=$py" >> "$GITHUB_ENV"
      - name: Mac support profile tests
        run: |
          node tools/test-support-mac.mjs
          node tools/test-support-mac-chat.mjs --gate=node
      - name: Mac support install tests
        run: node tools/test-support-mac-install.mjs
      - name: Support filing line tests
        run: node tools/test-reports.mjs
      - name: Trust tests (signed manifest, loader floor and cache, install stub, sandbox install)
        run: |
          node tools/test-manifest.mjs
          node tools/test-loader.mjs
          node tools/test-mini-gate.mjs
          node tools/test-pi-support.mjs
          node tools/test-install-line.mjs
          node tools/test-forwarder-gate.mjs
          node tools/test-spicetify-upstream.mjs
          node tools/test-install.mjs
          node tools/test-release-revs.mjs
          node tools/test-loader-perf.mjs
      - name: Tools parse
        run: for f in tools/*.mjs; do node --check "$f"; done
