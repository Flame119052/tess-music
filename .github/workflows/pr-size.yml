name: pr-size
# Labels every PR size:XS..XL so a reviewer can see at a glance how big it is.
# Runs as pull_request_target (it needs a write token for labels), so it must never check out or run PR code:
# it reads only the file list through the API. Tests count only when a PR is nothing but tests.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency: { group: 'pr-size-${{ github.event.pull_request.number }}', cancel-in-progress: true }
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sizes = [
              ['size:XS', 10, '0e8a16'], ['size:S', 30, '5ebd3e'], ['size:M', 100, 'fbca04'],
              ['size:L', 500, 'fe7d37'], ['size:XL', Infinity, 'd93f0b'],
            ];
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const isTest = (f) => /(^|\/)test-[^/]*\.mjs$|_test\.go$|(^|\/)fixtures?\//.test(f.filename);
            const counted = files.every(isTest) ? files : files.filter((f) => !isTest(f));
            const lines = counted.reduce((n, f) => n + f.additions + f.deletions, 0);
            const [name] = sizes.find(([, max]) => lines < max);
            for (const [label, , color] of sizes) {
              try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name: label, color }); }
            }
            const current = context.payload.pull_request.labels.map((l) => l.name);
            for (const old of current.filter((l) => l.startsWith('size:') && l !== name)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: old });
            }
            if (!current.includes(name)) await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [name] });
            core.notice(`${lines} changed lines -> ${name}`);
