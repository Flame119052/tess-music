name: stale
# Closes an issue 7 days after it was labelled "needs more info" if nobody replied. Nothing is marked
# automatically: only a person (or the support agent) adds the label. A reply removes it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-issue-labels: 'needs more info'
          stale-issue-label: 'needs more info'
          days-before-issue-stale: -1
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          close-issue-reason: not_planned
          close-issue-message: >-
            Closing: no reply in 7 days after we asked for more information.
            Reply with the details and we'll reopen it.
          operations-per-run: 100
