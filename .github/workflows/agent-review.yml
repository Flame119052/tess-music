name: send review request
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    if: >-
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      !contains(github.event.comment.body, '<!-- tess-review-bot -->') &&
      !contains(github.event.comment.body, '<!-- agent-review-bot -->') &&
      (contains(github.event.comment.body, '@review ') ||
       contains(github.event.comment.body, '@tess-review '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send repository and comment IDs to the review hub
        env:
          GH_TOKEN: ${{ secrets.AGENT_REVIEW_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          jq -c '{
            event_type: "agent-review",
            client_payload: {
              repository: .repository.full_name,
              issue_number: .issue.number,
              comment_id: .comment.id
            }
          }' "$GITHUB_EVENT_PATH" |
            gh api repos/Flame119052/agent-review/dispatches --input - --silent
