name: agent review
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      role: ${{ steps.gate.outputs.role }}
      number: ${{ steps.gate.outputs.number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      tier: ${{ steps.gate.outputs.tier }}
      runs_on: ${{ steps.machine.outputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check caller, request, and CI
        id: gate
        env:
          AGENT_ALLOWLIST: ${{ vars.AGENT_ALLOWLIST }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "allowed=false"
            echo "role="
            echo "number=$ISSUE_NUMBER"
            echo "head_sha="
            echo "tier="
          } >> "$GITHUB_OUTPUT"

          if [[ "$COMMENT_BODY" == *"<!-- tess-review-bot -->"* ]]; then
            exit 0
          fi

          caller_allowed=false
          IFS=',' read -ra accounts <<< "$AGENT_ALLOWLIST"
          for account in "${accounts[@]}"; do
            account="${account#"${account%%[![:space:]]*}"}"
            account="${account%"${account##*[![:space:]]}"}"
            if [[ "$account" == "$COMMENTER" ]]; then
              caller_allowed=true
              break
            fi
          done
          if [[ "$caller_allowed" != true ]]; then
            exit 0
          fi

          role="$(printf '%s\n' "$COMMENT_BODY" | awk '/^@tess-review (approach|pr)([[:space:]]|$)/ { print $2; exit }')"
          if [[ "$role" != "approach" && "$role" != "pr" ]]; then
            exit 0
          fi

          head_sha=
          tier=sensitive
          if [[ "$role" == "pr" ]]; then
            pr_url="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq '.pull_request.url // empty')"
            if [[ -z "$pr_url" ]]; then
              exit 0
            fi
            head_sha="$(gh api "repos/$REPOSITORY/pulls/$ISSUE_NUMBER" --jq '.head.sha')"
            conclusion="$(gh api "repos/$REPOSITORY/actions/workflows/check.yml/runs?head_sha=$head_sha&event=pull_request&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].conclusion // ""')"
            if [[ "$conclusion" != "success" ]]; then
              exit 0
            fi
            tier="$(gh api "repos/$REPOSITORY/pulls/$ISSUE_NUMBER/files" --paginate --jq '.[].filename' |
              node tools/agent-review.mjs tier)"
          fi

          {
            echo "allowed=true"
            echo "role=$role"
            echo "number=$ISSUE_NUMBER"
            echo "head_sha=$head_sha"
            echo "tier=$tier"
          } >> "$GITHUB_OUTPUT"
      - name: Pick the reviewer machine (Instabox first, then the VPS or omarchy)
        id: machine
        if: steps.gate.outputs.allowed == 'true'
        env:
          WAKE_URL: ${{ vars.REVIEW_WAKE_URL }}
        run: |
          # A request to the box's public page wakes a paused Instabox. Its /ready page answers with the exact body
          # "tess-ready", and only while its runner is active and idle, so a job is never pinned to a box that is still
          # starting, busy or paused. Platforms often serve a 200 "starting…" page, which is why the body is checked and
          # not just the status code. If it doesn't answer within 2 minutes (12 tries), the job goes to a backup machine.
          # With no wake URL configured there is no box to wake, so the job uses any tess-agent runner, as before.
          if [ -z "$WAKE_URL" ]; then
            echo 'runs_on=["self-hosted","tess-agent"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in $(seq 1 12); do
            if [ "$(curl -fsS --max-time 5 "${WAKE_URL%/}/ready" 2>/dev/null)" = "tess-ready" ]; then
              echo 'runs_on=["self-hosted","tess-agent","tess-primary"]' >> "$GITHUB_OUTPUT"
              echo "Instabox is ready."
              exit 0
            fi
            if [ "$i" -lt 12 ]; then sleep 5; fi
          done
          echo "Instabox didn't answer; using a backup machine."
          echo 'runs_on=["self-hosted","tess-agent","tess-backup"]' >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ${{ fromJSON(needs.gate.outputs.runs_on) }}
    # A box that freezes mid-job fails the review after 30 minutes. This does not cover a job still waiting in the
    # queue: if the box pauses after answering ready, the job waits for it (up to GitHub's 24-hour limit).
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Run read-only reviewer
        env:
          REVIEW_ROLE: ${{ needs.gate.outputs.role }}
          REVIEW_NUMBER: ${{ needs.gate.outputs.number }}
          REVIEW_TIER: ${{ needs.gate.outputs.tier }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/agent-review.mjs "$REVIEW_ROLE" "$REVIEW_NUMBER"
