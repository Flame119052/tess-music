# Every push to main that changes Tess is built, signed and published to the internal `dev` channel only: the
# owner's Mac follows it, nobody else does. Users get a build only when it is promoted (Actions → release → Run
# workflow → action: promote), which copies that exact dev build to stable and beta. Installed Macs then pick it up by
# themselves: the look on the next Spotify start, the other parts within ~20 minutes.
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   TESS_SIGNING_KEY   the Ed25519 private key (PEM) that signs releases
#   TESS_MIRROR_KEY    an SSH deploy key with write access to Flame119052/tess-releases only (the mirror 0.1.x installs read)
#   TESS_CODESIGN_P12 / TESS_CODESIGN_PASS   the stable "Tess Music" code-signing identity
name: release
on:
  push:
    branches: [main]
    paths: ['theme/**', 'mini/**', 'patcher/**', 'installer/**', 'tools/release.mjs', 'tools/build.mjs', 'tools/check-safety.sh']
  workflow_dispatch:
    inputs:
      action: { description: 'release (build to a channel) or promote (dev -> stable and beta)', default: 'promote', required: true }
      channel: { description: 'for release: dev, beta or stable', default: 'dev', required: false }
      version: { description: 'for promote: the version on dev to promote (empty = whatever dev has)', default: '', required: false }
concurrency: { group: release, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check the signing key is set
        id: key
        env: { K: '${{ secrets.TESS_SIGNING_KEY }}' }
        run: '[ -n "$K" ] && echo ok=1 >> "$GITHUB_OUTPUT" || echo "TESS_SIGNING_KEY not set; skipping release."'
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        if: steps.key.outputs.ok
        with: { go-version-file: patcher/go.mod, cache: false }
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok
        with: { node-version: 22 }
      - name: Safety checks (a release never ships if these fail)
        if: steps.key.outputs.ok
        run: tools/check-safety.sh
      - name: Build, sign and publish
        if: steps.key.outputs.ok
        env:
          TESS_SIGNING_KEY: ${{ secrets.TESS_SIGNING_KEY }}
          TESS_MIRROR_KEY: ${{ secrets.TESS_MIRROR_KEY }}
          TESS_CODESIGN_P12: ${{ secrets.TESS_CODESIGN_P12 }}
          TESS_CODESIGN_PASS: ${{ secrets.TESS_CODESIGN_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$TESS_MIRROR_KEY" > "$RUNNER_TEMP/mirror" && chmod 600 "$RUNNER_TEMP/mirror"
          export TESS_MIRROR_KEY_FILE="$RUNNER_TEMP/mirror"
          git config user.name "Tess release"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ github.event.inputs.action }}" = "promote" ]; then
            node tools/promote.mjs ${{ github.event.inputs.version }}
          else
            node tools/release.mjs auto "${{ github.event.inputs.channel || 'dev' }}"
          fi
