# Every push to main that changes Tess ships as an update to everyone on the stable channel.
# Installed Macs pick it up by themselves: the look on the next Spotify start, the other parts within ~20 minutes.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TESS_SIGNING_KEY   the Ed25519 private key (PEM) that signs releases
#   TESS_MIRROR_TOKEN  a token that can push to Flame119052/tess-releases (the mirror older installs read)
# Without them this workflow does nothing. Run it by hand from the Actions tab to ship to beta instead.
name: release
on:
  push:
    branches: [main]
    paths: ['theme/**', 'mini/**', 'patcher/**', 'installer/updater.sh', 'tools/release.mjs', 'tools/build.mjs']
  workflow_dispatch:
    inputs:
      channel: { description: 'stable or beta', default: 'beta', required: true }
concurrency: { group: release, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check the signing key is set
        id: key
        env: { K: '${{ secrets.TESS_SIGNING_KEY }}' }
        run: '[ -n "$K" ] && echo ok=1 >> "$GITHUB_OUTPUT" || echo "TESS_SIGNING_KEY not set; skipping release."'
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        if: steps.key.outputs.ok
        with: { go-version-file: patcher/go.mod, cache: false }
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok
        with: { node-version: 22 }
      - name: Build, sign and publish
        if: steps.key.outputs.ok
        env:
          TESS_SIGNING_KEY: ${{ secrets.TESS_SIGNING_KEY }}
          TESS_MIRROR_TOKEN: ${{ secrets.TESS_MIRROR_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Tess release"
          git config user.email "actions@users.noreply.github.com"
          node tools/release.mjs auto "${{ github.event.inputs.channel || 'stable' }}"
