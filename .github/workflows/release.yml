# Every relevant push to main builds the internal dev channel. A declaration copies dev to beta; a promotion copies
# that beta to stable. The release environment puts both public-channel actions behind a human approval.
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   TESS_SIGNING_KEY   the Ed25519 private key (PEM) that signs releases
#   TESS_MIRROR_KEY    an SSH deploy key with write access to Flame119052/tess-releases only (the mirror 0.1.x installs read)
#   TESS_CODESIGN_P12 / TESS_CODESIGN_PASS   the stable "Tess Music" code-signing identity
name: release
on:
  push:
    branches: [main]
    paths: ['theme/**', 'mini/**', 'patcher/**', 'installer/**', 'tools/release.mjs', 'tools/build.mjs', 'tools/check-safety.sh']
  workflow_dispatch:
    inputs:
      action:
        description: 'release (main -> dev), declare (dev -> beta), or promote (beta -> stable)'
        type: choice
        options: [release, declare, promote]
        default: declare
        required: true
      version:
        description: 'Expected source version (empty = current dev or beta)'
        type: string
        default: ''
        required: false
# One group so a declare never races a dev build; queue: max keeps every waiting run (the default keeps one and
# drops the older, which could silently lose a declare or promote queued behind a build).
concurrency: { group: release, cancel-in-progress: false, queue: max }
permissions: { contents: write }
jobs:
  release:
    if: github.event_name == 'push' || inputs.action == 'release'
    runs-on: macos-latest
    steps:
      - name: Check the signing key is set
        id: key
        env: { K: '${{ secrets.TESS_SIGNING_KEY }}' }
        run: '[ -n "$K" ] && echo ok=1 >> "$GITHUB_OUTPUT" || echo "TESS_SIGNING_KEY not set; skipping release."'
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        if: steps.key.outputs.ok
        with: { go-version-file: patcher/go.mod, cache: false }
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok
        with: { node-version: 22 }
      - name: Safety checks (a release never ships if these fail)
        if: steps.key.outputs.ok
        run: tools/check-safety.sh
      - name: Build, sign and publish
        if: steps.key.outputs.ok
        env:
          TESS_SIGNING_KEY: ${{ secrets.TESS_SIGNING_KEY }}
          TESS_MIRROR_KEY: ${{ secrets.TESS_MIRROR_KEY }}
          TESS_CODESIGN_P12: ${{ secrets.TESS_CODESIGN_P12 }}
          TESS_CODESIGN_PASS: ${{ secrets.TESS_CODESIGN_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$TESS_MIRROR_KEY" > "$RUNNER_TEMP/mirror" && chmod 600 "$RUNNER_TEMP/mirror"
          export TESS_MIRROR_KEY_FILE="$RUNNER_TEMP/mirror"
          git config user.name "Tess release"
          git config user.email "actions@users.noreply.github.com"
          node tools/release.mjs auto dev

  declare:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'declare'
    runs-on: macos-latest
    environment: release
    env:
      TESS_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Declare dev on beta
        env:
          TESS_MIRROR_KEY: ${{ secrets.TESS_MIRROR_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$TESS_MIRROR_KEY" > "$RUNNER_TEMP/mirror"
          chmod 600 "$RUNNER_TEMP/mirror"
          export TESS_MIRROR_KEY_FILE="$RUNNER_TEMP/mirror"
          git config user.name "Tess release"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$TESS_VERSION" ]; then
            node tools/declare.mjs "$TESS_VERSION"
          else
            node tools/declare.mjs
          fi

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
    runs-on: macos-latest
    environment: release
    env:
      TESS_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Promote beta to stable
        env:
          TESS_MIRROR_KEY: ${{ secrets.TESS_MIRROR_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$TESS_MIRROR_KEY" > "$RUNNER_TEMP/mirror"
          chmod 600 "$RUNNER_TEMP/mirror"
          export TESS_MIRROR_KEY_FILE="$RUNNER_TEMP/mirror"
          git config user.name "Tess release"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$TESS_VERSION" ]; then
            node tools/promote.mjs "$TESS_VERSION"
          else
            node tools/promote.mjs
          fi
