# Renews the ChatGPT-plan login the reviewer uses (D-111). This file never runs on a pull request
# or a comment, and the token that can write secrets is not given to any review job.
name: codex refresh
on:
  schedule:
    # Every four days at 06:00 UTC. The access token lasts about ten days, so this lands inside that.
    - cron: '0 6 */4 * *'
  workflow_dispatch:

# A second run must not start while the first is still writing the rotated refresh token.
concurrency:
  group: codex-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the Codex login
        env:
          # This step can read the login and nothing else. The automatic job token is cleared so a
          # failure here cannot call the GitHub API.
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: node tools/codex-refresh.mjs --write "$RUNNER_TEMP/codex-auth.json"
      - name: Store the refreshed login
        env:
          # Fine-grained PAT: Actions read, and Secrets read and write, on this repository only.
          GH_TOKEN: ${{ secrets.CODEX_SECRET_ROTATOR_TOKEN }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            gh secret set CODEX_AUTH_JSON -R "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/codex-auth.json" && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
      - name: Remove the temp login
        if: always()
        run: rm -f "$RUNNER_TEMP/codex-auth.json"
