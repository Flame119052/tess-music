name: Something's wrong
description: Tess or Spotify isn't working or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot or screen recording helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: "1. Open …\n2. Click …"
  - type: input
    id: report
    attributes:
      label: Install id (optional)
      description: Run `"$HOME/Library/Application Support/Tess/tess" report` in Terminal and paste the id it prints. It sends an anonymous health report so the problem can be found.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Tess version (Settings → Tess Music), Spotify version, macOS version.
      placeholder: "Tess 0.2.22 · Spotify 1.3.9.2055 · macOS 26.5"
  - type: textarea
    id: check
    attributes:
      label: For whoever fixes it
      description: Leave as is.
      value: "Reproduce first (sandbox copy of Spotify for anything touching the installer), fix, and attach the proof (screenshot, numbers, or test output). See AGENTS.md."
